[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradienthound"
version = "0.1.0"
description = "Hook into ML training to visualize and inspect model architectures in real time"
readme = "README.md"
license = "MIT"
authors = [{ name = "Adrian Mircea Nenu" }]
keywords = ["pytorch", "machine-learning", "visualization", "training", "gradients", "telemetry"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "graphviz>=0.20",
]

[project.urls]
Homepage = "http://gradient-hound.nenuadrian.com/"
Documentation = "http://gradient-hound.nenuadrian.com/"
Repository = "https://github.com/nenuadrian/GradientHound"
Issues = "https://github.com/nenuadrian/GradientHound/issues"

[project.optional-dependencies]
torch = ["torch>=2.0"]
dash = ["dash>=2.14", "plotly>=5.18", "dash-cytoscape>=1.0", "dash-bootstrap-components>=1.5", "wandb>=0.17"]
analysis = ["fvcore>=0.1.5", "torch-pruning>=1.4"]
spectral = ["powerlaw>=1.5"]
embeddings = ["scikit-learn>=1.3", "umap-learn>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.4", "torch>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gradienthound"]

[tool.hatch.build]
include = [
    "src/gradienthound/assets/*.png",
]
