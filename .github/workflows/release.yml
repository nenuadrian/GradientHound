name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/gradienthound/__init__.py)
          CFF=$(sed -n 's/^version: *//p' CITATION.cff | tr -d '"')
          echo "tag=$TAG pyproject=$PKG __init__=$INIT CITATION.cff=$CFF"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$INIT" ] || [ "$TAG" != "$CFF" ]; then
            echo "::error::Tag v$TAG does not match pyproject ($PKG), __init__ ($INIT), CITATION.cff ($CFF). Bump all versions before tagging."
            exit 1
          fi

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
